services:
  mysql:
    image: mysql:8.4
    container_name: sql-server-mysql
    restart: unless-stopped
    command: --default-time-zone=+07:00
    environment:
      TZ: Asia/Jakarta
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Bind ke semua interface supaya bisa diakses dari LAN.
      # Keamanan dijaga oleh Windows Firewall (dibatasi ke subnet lokal).
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    # Volume ini yang menyimpan data secara persisten.
    # Selama volume ini tidak dihapus, data aman walau container di-restart/rebuild.
